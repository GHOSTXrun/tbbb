<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="查看 Solana 代币的市场数据、合约和可用兑换。">
<base href="./token-desk/">
<title>Token Desk</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.mjs"></script>
</head>
<body>
<header class="shell top">
  <a href="./" class="brand"><img id="logo" alt="" hidden><span id="mark" aria-hidden="true">◆</span><span id="brand">Token Desk</span></a>
  <button id="wallet" type="button">连接 Phantom</button>
</header>
<main class="shell">
  <section class="intro">
    <p class="eyebrow">SOLANA / 市场</p>
    <h1>代币工作台</h1>
    <p>查看链上代币行情、复制 Mint 地址，或通过 Jupiter 兑换。</p>
  </section>
  <div class="board">
    <aside class="panel">
      <h2>代币列表</h2>
      <nav id="tokens" aria-label="代币"></nav>
      <form id="find">
        <label for="mint-input">按 Mint 地址查看</label>
        <div class="input-row"><input id="mint-input" required autocomplete="off" placeholder="输入 Solana Mint"><button>打开</button></div>
      </form>
      <p id="wallet-status" class="muted" role="status"></p>
    </aside>
    <section class="panel detail" aria-labelledby="token-title">
      <div class="token-head"><div class="avatar" id="avatar"></div><div><p class="eyebrow" id="symbol">SOLANA TOKEN</p><h2 id="token-title">加载中</h2></div></div>
      <div class="mint"><code id="address"></code><button type="button" id="copy">复制</button></div>
      <div class="market-head"><h3>市场数据</h3><button type="button" id="refresh">刷新</button></div>
      <dl class="metrics">
        <div><dt>价格</dt><dd id="price">—</dd></div>
        <div><dt>24 小时变化</dt><dd id="change">—</dd></div>
        <div><dt>24 小时成交量</dt><dd id="volume">—</dd></div>
        <div><dt>流动性</dt><dd id="liquidity">—</dd></div>
      </dl>
      <p class="muted" id="market-status" role="status"></p>
      <div class="actions">
        <button class="primary" id="swap" type="button">打开 Jupiter 兑换</button>
        <a id="explorer" target="_blank" rel="noopener noreferrer">Solscan</a>
        <a id="pump" target="_blank" rel="noopener noreferrer">pump.fun</a>
        <a id="dex" target="_blank" rel="noopener noreferrer">DexScreener</a>
      </div>
      <section id="swap-section" hidden aria-labelledby="swap-title">
        <h3 id="swap-title">Jupiter 兑换</h3>
        <p id="swap-status" class="muted" role="status"></p>
        <div id="jupiter-container"></div>
      </section>
    </section>
  </div>
  <section class="panel privacy">
    <div><h2>隐私金库</h2><p class="muted">本站尚未接入 Privacy Rings，无法核验此代币的注册状态或办理存取。</p></div>
    <a href="https://www.helius.dev/blog/solana-privacy-rings" target="_blank" rel="noopener noreferrer">查看 Helius 说明</a>
  </section>
</main>
</body>
</html>
